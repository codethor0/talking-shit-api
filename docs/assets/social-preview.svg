  <rect width="1280" height="640" fill="#0d1117"/>
  <rect x="0" y="0" width="1280" height="8" fill="#f38020"/>
  <text x="80" y="170" font-family="Helvetica, Arial, sans-serif" font-size="84" font-weight="700" fill="#ffffff">Talking Shit API</text>
  <text x="80" y="235" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#c9d1d9">Professional-grade shit talking for</text>
  <text x="80" y="280" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#c9d1d9">unprofessional developer moments.</text>
  <rect x="80" y="340" width="1120" height="150" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="112" y="392" font-family="Menlo, Consolas, monospace" font-size="26" fill="#7ee787">$ curl -s '.../v1/roast?category=code&amp;level=dark'</text>
